<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title | default: site.title }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <div class="background-overlay"></div>
  
  <header class="site-header">
    <div class="brand">
      <h1 class="logo-title">Shay’s Hearth</h1>
      <p class="tagline">Artisanal Goods & Handcrafted Creations</p>
    </div>
    <nav class="site-nav">
      <a href="{{ '/' | relative_url }}">Home</a>
      <a href="{{ '/products.html' | relative_url }}">Products</a>
    </nav>
  </header>

  <main class="content-wrapper">
    <section class="glass-card">
      {{ content }}
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; {{ 'now' | date: "%Y" }} Shay’s Hearth. All Rights Reserved.</p>
  </footer>
</body>
</html>
